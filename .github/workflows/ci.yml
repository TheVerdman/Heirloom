name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Rust validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run validation
        run: ./scripts/validate.sh
