[package]
name = "heirloom"
version = "0.1.0"
edition = "2021"
description = "A small Rust tensor/autograd runtime prototype built to expose PyTorch-like design pressure."
license = "MIT OR Apache-2.0"

[workspace]
members = [".", "heirloom-kernels", "heirloom-python"]
resolver = "2"

[lib]
name = "heirloom"
path = "src/lib.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "classify"
path = "src/bin/classify.rs"

[[bin]]
name = "custom"
path = "src/bin/custom.rs"

[[bin]]
name = "heirloom"
path = "src/bin/heirloom.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
heirloom-kernels = { path = "heirloom-kernels" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12"

[dev-dependencies]
proptest = "1.6"
