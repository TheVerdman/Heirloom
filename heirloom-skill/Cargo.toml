[package]
name = "heirloom-skill"
version = "0.1.0"
edition = "2021"
description = "Rust-native compiler and runtime pipeline for Heirloom SKILL.md artifacts."
license = "MIT OR Apache-2.0"

[lib]
name = "heirloom_skill"
path = "src/lib.rs"

[[bin]]
name = "heirloom-skill"
path = "src/bin/heirloom-skill.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
